on: [push, workflow_dispatch]
name: Linux_Container_Workflow
env:
  AWS_REGION: ap-northeast-2                   
  # ECR_REPOSITORY: aws-webapp
  IMAGE_PATH: Dockerfile
  ECR_REGISTRY: 022499044118.dkr.ecr.ap-northeast-2.amazonaws.com
  # IMAGE_TAG: ${{ github.sha }}
  IMAGE_NAME: 022499044118.dkr.ecr.ap-northeast-2.amazonaws.com/aws-webapp:${{ github.sha }}
  # API_URL: https://api-japac-ccr.xdr.jp.paloaltonetworks.com
  API_URL: https://api-jashin.xdr.kr.paloaltonetworks.com
  # API_KEY: ${{ secrets.API_KEY }}
  # API_KEY_ID: ${{ secrets.API_KEY_ID }}
  API_KEY: "H22K8u9N5Tu1unLp5CqEV8nzz77tDXDkxncaoc3Ax8PvEp3l4cWEzEl9MKRWyFDF7eCo9IN8z5jp7dJS2t4glhnTiklfO6mwk2Vp5lKqHbQpbPkIqMcsTod5Ig8kmkW5"
  API_KEY_ID: 27
jobs:
    build-and-scan-deploy:
        runs-on: ubuntu-latest
        steps:
        # checkout the repo
        - name: 'Checkout GitHub Action'
          uses: actions/checkout@main

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v1
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Download cortexcli
          run: |
            set -x
            # crtx_resp=$(curl "${{ env.API_URL }}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            # -H "x-xdr-auth-id: ${{ env.API_KEY_ID }}" \
            # -H "Authorization: ${{ env.API_KEY }}")
            # crtx_url=$(echo $crtx_resp | jq -r ".signed_url")
            # curl -o cortexcli $crtx_url
            crtx_resp=$(curl -s "${{ env.API_URL }}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" -H "x-xdr-auth-id: ${{ env.API_KEY_ID }}" -H "Authorization: ${{ env.API_KEY }}") && crtx_url=$(echo $crtx_resp | jq -r ".signed_url") && crtx_file=$(echo $crtx_resp | jq -r ".file_name") && curl -o $crtx_file $crtx_url 
            chmod +x cortexcli
            ./cortexcli --version
        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v1

        - name: Build and Scan the image
          # env:
          #   ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          #   IMAGE_TAG: ${{ github.sha }}
          run: |
            docker build -t $IMAGE_NAME .
            # docker save $IMAGE_NAME > dockerimage.tar
            ./cortexcli --upload-mode upload --api-base-url ${{ env.API_URL }} --api-key ${{ env.API_KEY }} --api-key-id ${{ env.API_KEY_ID }} image scan $IMAGE_NAME
    

        # - name: Push the image to Amazon ECR
        #   id: build-image
        #   run: |
        #     docker push $IMAGE_NAME
